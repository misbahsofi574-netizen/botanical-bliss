<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Botanical Bliss Admin</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="admin-sidebar">

        <div class="sidebar-brand">

            <i class="bi bi-flower1"></i>

            <span>Botanical Bliss</span>

        </div>


        <nav class="sidebar-nav">

            <a href="admin.html">

                <i class="bi bi-grid"></i>

                <span>Dashboard</span>

            </a>


            <a href="products.html" class="active">

                <i class="bi bi-box-seam"></i>

                <span>Products</span>

            </a>


            <a href="orders.html">

                <i class="bi bi-bag"></i>

                <span>Orders</span>

            </a>


            <a href="users.html">

                <i class="bi bi-people"></i>

                <span>Users</span>

            </a>


            <a href="garden-gallery-admin.html">

                <i class="bi bi-images"></i>

                <span>Garden Gallery</span>

            </a>

        </nav>


        <div class="sidebar-bottom">

            <a href="../home.html">

                <i class="bi bi-globe2"></i>

                <span>Visit Website</span>

            </a>


            <button id="adminLogout">

                <i class="bi bi-box-arrow-right"></i>

                <span>Logout</span>

            </button>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="admin-main">

        <div class="admin-header">

            <div>

                <h1>Products</h1>

                <p>
                    Manage your gardening products
                </p>

            </div>


            <button
                class="admin-primary-btn"
                id="addProductBtn"
            >

                <i class="bi bi-plus-lg"></i>

                Add Product

            </button>

        </div>


        <!-- PRODUCTS TABLE -->

        <section class="admin-section">

<div class="section-heading products-section-heading">

    <div>

        <h2>All Products</h2>

        <p>
            View and manage your products
        </p>

    </div>

    <div class="products-summary">

        <div class="products-count-box">

            <i class="bi bi-box-seam"></i>

            <div>
                <strong id="productsCount">0</strong>
                <span>Total Products</span>
            </div>

        </div>

        <button
            type="button"
            id="refreshProductsBtn"
            class="products-refresh-btn"
        >
            <i class="bi bi-arrow-clockwise"></i>
            Refresh
        </button>

    </div>

</div>
<!-- PRODUCT FILTERS -->

<div class="products-toolbar">

    <div class="products-search">

        <i class="bi bi-search"></i>

        <input
            type="text"
            id="productSearchInput"
            placeholder="Search by product name or category..."
        >

    </div>


    <select
        id="productCategoryFilter"
        class="products-filter"
    >

        <option value="all">
            All Categories
        </option>

    </select>


    <select
        id="productStockFilter"
        class="products-filter"
    >

        <option value="all">
            All Stock
        </option>

        <option value="in-stock">
            In Stock
        </option>

        <option value="low-stock">
            Low Stock
        </option>

        <option value="out-of-stock">
            Out of Stock
        </option>

    </select>

</div>

            <div class="orders-table-wrapper">

                <table class="orders-table">

                    <thead>

                        <tr>

                            <th>Product</th>

                            <th>Category</th>

                            <th>Price</th>

                            <th>Stock</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="productsBody">

                        <tr>

                            <td
                                colspan="6"
                                class="orders-empty"
                            >

                                Loading products...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- PRODUCT MODAL -->

    <div
        class="order-modal"
        id="productModal"
    >

        <div class="order-modal-content">

            <div class="order-modal-header">

                <div>

                    <h2 id="productModalTitle">
                        Add Product
                    </h2>

                    <p>
                        Enter product information
                    </p>

                </div>


                <button
                    class="modal-close"
                    id="closeProductModal"
                >

                    <i class="bi bi-x-lg"></i>

                </button>

            </div>


            <form id="productForm">

                <input
                    type="hidden"
                    id="productId"
                >


                <div class="product-form-grid">

                    <div class="form-group">

                        <label for="productName">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="productName"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="productCategory">
                            Category
                        </label>

                        <input
                            type="text"
                            id="productCategory"
                            placeholder="e.g. Indoor Plants"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="productPrice">
                            Price
                        </label>

                        <input
                            type="number"
                            id="productPrice"
                            min="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="productStock">
                            Stock
                        </label>

                        <input
                            type="number"
                            id="productStock"
                            min="0"
                            value="0"
                        >

                    </div>


                    <div class="form-group">

                        <label for="productImage">
                            Image
                        </label>

                        <input
                            type="text"
                            id="productImage"
                            placeholder="images/product.jpg"
                        >

                    </div>


                    <div class="form-group">

                        <label for="productStatus">
                            Status
                        </label>

                        <select id="productStatus">

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>


                    <div class="form-group form-group-full">

                        <label for="productDescription">
                            Description
                        </label>

                        <textarea
                            id="productDescription"
                            rows="4"
                            placeholder="Enter product description"
                        ></textarea>

                    </div>

                </div>


                <div class="product-form-actions">

                    <button
                        type="button"
                        class="modal-cancel-btn"
                        id="cancelProductBtn"
                    >

                        Cancel

                    </button>


                    <button
                        type="submit"
                        class="admin-primary-btn"
                    >

                        Save Product

                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="products.js"></script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Profile | Botanical Bliss</title>

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>


<body class="shop-page">


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="home-nav">

        <a href="home.html"
            class="home-brand">

            <i class="bi bi-flower1"></i>

            <span>
                Botanical Bliss
            </span>

        </a>


        <div class="home-nav-links">

            <a href="home.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="gardening-guide.html">
                Gardening Guide
            </a>

            <a href="garden-calendar.html">
                Garden Calendar
            </a>

            <a href="seasonal-guide.html">
                Seasonal Guide
            </a>

        </div>


        <div class="home-nav-actions">

            <a href="wishlist.html"
                class="nav-icon-button"
                title="Wishlist">

                <i class="bi bi-heart"></i>

            </a>


            <a href="cart.html">

                <button
                    class="nav-icon-button cart-button"
                    title="Cart"
                    type="button">

                    <i class="bi bi-bag"></i>

                    <span id="cartCount">
                        0
                    </span>

                </button>

            </a>


            <a href="dashboard.html"
                class="profile-button"
                title="Dashboard">

                <i class="bi bi-person"></i>

            </a>

        </div>

    </nav>



    <!-- =========================
         PROFILE
    ========================== -->

    <main class="profile-page">

        <div class="profile-container">

            <div class="profile-header">

                <div class="profile-icon">

                    <i class="bi bi-person"></i>

                </div>

                <div>

                    <h1>
                        My Profile
                    </h1>

                    <p>
                        Manage your Botanical Bliss account.
                    </p>

                </div>

            </div>


            <div class="profile-card">


                <!-- NAME -->

                <div class="profile-detail">

                    <div class="profile-detail-icon">

                        <i class="bi bi-person"></i>

                    </div>

                    <div>

                        <span>
                            Full Name
                        </span>

                        <strong id="profileName">
                            —
                        </strong>

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="profile-detail">

                    <div class="profile-detail-icon">

                        <i class="bi bi-envelope"></i>

                    </div>

                    <div>

                        <span>
                            Email Address
                        </span>

                        <strong id="profileEmail">
                            —
                        </strong>

                    </div>

                </div>


                <!-- ACCOUNT TYPE -->

                <div class="profile-detail">

                    <div class="profile-detail-icon">

                        <i class="bi bi-shield-check"></i>

                    </div>

                    <div>

                        <span>
                            Account Type
                        </span>

                        <strong id="profileRole">
                            User
                        </strong>

                    </div>

                </div>


                <div class="profile-actions">

                    <a href="dashboard.html"
                        class="profile-back-button">

                        <i class="bi bi-arrow-left"></i>

                        Back to Dashboard

                    </a>


                    <button
                        type="button"
                        id="logoutButton"
                        class="profile-logout-button">

                        <i class="bi bi-box-arrow-right"></i>

                        Logout

                    </button>

                </div>

            </div>

        </div>

    </main>



    <!-- =========================
         PROFILE SCRIPT
    ========================== -->

    <script>

        /* =========================
           GET LOGGED-IN USER
        ========================= */

        const storedUser =
            localStorage.getItem("user");


        if (!storedUser) {

            window.location.href =
                "login.html";

        } else {

            const user =
                JSON.parse(storedUser);


            /* NAME */

            const profileName =
                document.getElementById(
                    "profileName"
                );

            if (profileName) {

                profileName.textContent =
                    user.name || "User";

            }


            /* EMAIL */

            const profileEmail =
                document.getElementById(
                    "profileEmail"
                );

            if (profileEmail) {

                profileEmail.textContent =
                    user.email || "—";

            }


            /* ROLE */

            const profileRole =
                document.getElementById(
                    "profileRole"
                );

            if (profileRole) {

                profileRole.textContent =
                    user.role || "User";

            }


            /* =========================
               CART COUNT
            ========================= */

            const userId =
                user._id ||
                user.id ||
                user.email;

            const cartKey =
                `cart_${userId}`;

            const cart =
                JSON.parse(
                    localStorage.getItem(cartKey)
                ) || [];


            const cartCount =
                cart.reduce(
                    function(total, item) {

                        return total +
                            Number(
                                item.quantity || 0
                            );

                    },
                    0
                );


            const cartCountElement =
                document.getElementById(
                    "cartCount"
                );

            if (cartCountElement) {

                cartCountElement.textContent =
                    cartCount;

            }

        }


        /* =========================
           LOGOUT
        ========================= */

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        if (logoutButton) {

            logoutButton.addEventListener(
                "click",
                function() {

                    localStorage.removeItem(
                        "token"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    window.location.href =
                        "login.html";

                }
            );

        }

    </script>

</body>

</html>
